# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: better-apigate

before:
  hooks:
    - make contracts
    - npm ci --prefix webui
    - make webui

builds:
  # Linux AMD64
  - id: linux-amd64
    binary: better-apigate
    main: ./cmd/better-apigate
    goos:
      - linux
    goarch:
      - amd64
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.buildDate={{.Date}}
    tags:
      - netgo
      - osusergo

  # Linux ARM64
  - id: linux-arm64
    binary: better-apigate
    main: ./cmd/better-apigate
    goos:
      - linux
    goarch:
      - arm64
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.buildDate={{.Date}}
    tags:
      - netgo
      - osusergo

  # macOS AMD64 (cross-compiled without CGO)
  - id: darwin-amd64
    binary: better-apigate
    main: ./cmd/better-apigate
    goos:
      - darwin
    goarch:
      - amd64
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.buildDate={{.Date}}

  # macOS ARM64 (cross-compiled without CGO)
  - id: darwin-arm64
    binary: better-apigate
    main: ./cmd/better-apigate
    goos:
      - darwin
    goarch:
      - arm64
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.buildDate={{.Date}}

  # Windows AMD64
  - id: windows-amd64
    binary: better-apigate
    main: ./cmd/better-apigate
    goos:
      - windows
    goarch:
      - amd64
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.buildDate={{.Date}}

archives:
  - id: default
    format: tar.gz
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE*
      - .env.example
      - docker-compose.yaml
      - docs/deployment-v2.md
      - scripts/init-env.sh
      - scripts/backup.sh
      - scripts/restore.sh
      - scripts/install.sh

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: coolqoo
    name: better-apigate
  prerelease: auto
  draft: false
  name_template: "{{.ProjectName}} v{{.Version}}"

# Docker Hub images are published by .github/workflows/docker.yml from the CI artifacts.
