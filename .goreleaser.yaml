# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: apigate

before:
  hooks:
    - make contracts
    - npm ci --prefix webui
    - make webui

builds:
  # Linux AMD64
  - id: linux-amd64
    binary: apigate
    main: ./cmd/apigate
    goos:
      - linux
    goarch:
      - amd64
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.buildDate={{.Date}}
    tags:
      - netgo
      - osusergo

  # Linux ARM64
  - id: linux-arm64
    binary: apigate
    main: ./cmd/apigate
    goos:
      - linux
    goarch:
      - arm64
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.buildDate={{.Date}}
    tags:
      - netgo
      - osusergo

  # macOS AMD64 (built on macOS runner)
  - id: darwin-amd64
    binary: apigate
    main: ./cmd/apigate
    goos:
      - darwin
    goarch:
      - amd64
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.buildDate={{.Date}}

  # macOS ARM64 (built on macOS runner)
  - id: darwin-arm64
    binary: apigate
    main: ./cmd/apigate
    goos:
      - darwin
    goarch:
      - arm64
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.buildDate={{.Date}}

  # Windows AMD64
  - id: windows-amd64
    binary: apigate
    main: ./cmd/apigate
    goos:
      - windows
    goarch:
      - amd64
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.buildDate={{.Date}}

archives:
  - id: default
    format: tar.gz
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE*
      - .env.example
      - docker-compose.yaml
      - docs/deployment-v2.md
      - scripts/init-env.sh
      - scripts/backup.sh
      - scripts/restore.sh
      - scripts/install.sh

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: coolqoo
    name: better-apigate
  prerelease: auto
  draft: false
  name_template: "{{.ProjectName}} v{{.Version}}"

# Docker images
dockers:
  - image_templates:
      - "ghcr.io/coolqoo/better-apigate:{{ .Version }}-amd64"
      - "ghcr.io/coolqoo/better-apigate:latest-amd64"
    dockerfile: Dockerfile.goreleaser
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.source=https://github.com/coolqoo/better-apigate"
    goos: linux
    goarch: amd64
    ids:
      - linux-amd64

  - image_templates:
      - "ghcr.io/coolqoo/better-apigate:{{ .Version }}-arm64"
      - "ghcr.io/coolqoo/better-apigate:latest-arm64"
    dockerfile: Dockerfile.goreleaser
    use: buildx
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.source=https://github.com/coolqoo/better-apigate"
    goos: linux
    goarch: arm64
    ids:
      - linux-arm64

docker_manifests:
  - name_template: "ghcr.io/coolqoo/better-apigate:{{ .Version }}"
    image_templates:
      - "ghcr.io/coolqoo/better-apigate:{{ .Version }}-amd64"
      - "ghcr.io/coolqoo/better-apigate:{{ .Version }}-arm64"
  - name_template: "ghcr.io/coolqoo/better-apigate:latest"
    image_templates:
      - "ghcr.io/coolqoo/better-apigate:latest-amd64"
      - "ghcr.io/coolqoo/better-apigate:latest-arm64"
