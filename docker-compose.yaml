x-gateway: &gateway
  image: ${APIGATE_IMAGE:-coolqoo/better-apigate:1.0.0}
  build: .
  env_file: .env
  environment:
    APIGATE_DATABASE_DSN: ${APIGATE_DATABASE_DSN:?Set your PostgreSQL connection URL in .env}
    APIGATE_REDIS_URL: ${APIGATE_REDIS_URL:?Set your Redis connection URL in .env}
    APIGATE_API_KEY_SECRET: ${APIGATE_API_KEY_SECRET:?Run scripts/init-env.sh}
    APIGATE_SETUP_TOKEN: ${APIGATE_SETUP_TOKEN:?Run scripts/init-env.sh}
    APIGATE_METRICS_TOKEN: ${APIGATE_METRICS_TOKEN:-}
    APIGATE_PUBLIC_URL: ${APIGATE_PUBLIC_URL:-http://localhost:8080}
    APIGATE_SERVER_PORT: "8080"
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: unless-stopped
  stop_grace_period: 40s
  read_only: true
  tmpfs: [/tmp]

services:
  gateway:
    <<: *gateway
    ports: ["${APIGATE_PORT:-8080}:8080"]

  gateway-two:
    <<: *gateway
    profiles: [replica]
    ports: ["${APIGATE_REPLICA_PORT:-8082}:8080"]

  # An optional PostgreSQL client for backup/restore of the external database.
  # It does not start a PostgreSQL server or run during ordinary compose up.
  postgres-tools:
    profiles: [maintenance]
    image: ${APIGATE_POSTGRES_CLIENT_IMAGE:-postgres:17.10-alpine}
    environment:
      APIGATE_DATABASE_DSN: ${APIGATE_DATABASE_DSN:?Set your PostgreSQL connection URL in .env}
    entrypoint: /bin/sh
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs: [/tmp]
