name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  release:
    name: Publish native archives
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: better-apigate-*
          path: dist
          merge-multiple: true
      - name: Package verified build artifacts
        run: |
          mkdir -p release
          for target in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            chmod +x "dist/better-apigate-$target"
            tar -C dist -czf "release/better-apigate-$target.tar.gz" "better-apigate-$target"
          done
          (cd dist && zip ../release/better-apigate-windows-amd64.zip better-apigate-windows-amd64.exe)
          (cd release && sha256sum *.tar.gz *.zip > checksums.txt)
      - name: Identify prerelease
        id: version
        run: |
          version="${GITHUB_REF_NAME%%+*}"
          if [[ "$version" == *-* ]]; then
            echo 'prerelease=true' >> "$GITHUB_OUTPUT"
          else
            echo 'prerelease=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: better-apigate ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*.tar.gz
            release/*.zip
            release/checksums.txt
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
