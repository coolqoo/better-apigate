name: CI
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_call:
env:
  GO_VERSION: '1.27.1'
  NODE_VERSION: '22.23.2'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v5
        with: {go-version: '${{ env.GO_VERSION }}', cache: true}
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Frontend checks and embedded build
        run: |
          npm ci --prefix webui
          npm audit --prefix webui --audit-level=high
          make webui
          git diff --exit-code -- core/channel/http/webui/dist
      - name: Generated API contracts
        run: |
          make contracts
          git diff --exit-code -- docs/openapi-v2.json webui/src/v2/contracts.generated.ts
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: frontend-build
          path: |
            core/channel/http/webui/dist/
          include-hidden-files: true
  build:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {os: linux, arch: amd64, suffix: ''}
          - {os: linux, arch: arm64, suffix: ''}
          - {os: darwin, arch: amd64, suffix: ''}
          - {os: darwin, arch: arm64, suffix: ''}
          - {os: windows, arch: amd64, suffix: '.exe'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '${{ env.GO_VERSION }}', cache: true}
      - name: Build without SQLite or a C compiler
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: go build -trimpath -ldflags="-s -w" -o apigate-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.suffix }} ./cmd/apigate
