name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  GO_VERSION: '1.27.1'
  NODE_VERSION: '22.23.2'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate release tag
        if: github.ref_type == 'tag'
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo '::error::Release tags must be semantic versions, such as v1.0.0 or v1.0.0-rc.1, without build metadata.'
            exit 1
          fi
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Generated API contracts
        run: |
          make contracts
          git diff --exit-code -- docs/openapi-v2.json webui/src/v2/contracts.generated.ts
      - name: Frontend checks and embedded build
        run: |
          npm ci --prefix webui
          npm audit --prefix webui --audit-level=high
          make webui
          git diff --exit-code -- core/channel/http/webui/dist
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: frontend-build
          path: core/channel/http/webui/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  build:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: linux, arch: amd64, suffix: ''}
          - {os: linux, arch: arm64, suffix: ''}
          - {os: darwin, arch: amd64, suffix: ''}
          - {os: darwin, arch: arm64, suffix: ''}
          - {os: windows, arch: amd64, suffix: '.exe'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Remove committed frontend before restoring the build
        run: rm -rf core/channel/http/webui/dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontend-build
          path: core/channel/http/webui/dist/
      - name: Build embedded gateway
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          BINARY: better-apigate-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.suffix }}
        run: |
          version="dev-${GITHUB_SHA:0:12}"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then version="$GITHUB_REF_NAME"; fi
          build_date="$(git show -s --format=%cI HEAD)"
          mkdir -p dist
          go build -trimpath -tags 'netgo osusergo' \
            -ldflags="-s -w -X main.version=$version -X main.commit=$GITHUB_SHA -X main.buildDate=$build_date" \
            -o "dist/$BINARY" ./cmd/better-apigate
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: better-apigate-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/better-apigate-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.suffix }}
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Publish Docker Hub image
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/docker.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
