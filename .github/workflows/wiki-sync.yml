name: Sync Wiki

on:
  push:
    branches:
      - main
    paths:
      - 'docs/spec/**'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  sync-wiki:
    name: Sync docs/spec to Wiki
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: main

      - name: Clone wiki when initialized
        id: wiki
        env:
          WIKI_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > "$RUNNER_TEMP/wiki-askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$WIKI_TOKEN" ;;
          esac
          SH
          chmod 0700 "$RUNNER_TEMP/wiki-askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/wiki-askpass" GIT_TERMINAL_PROMPT=0
          wiki_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.wiki.git"
          if git ls-remote "$wiki_url" HEAD > /dev/null 2>&1; then
            git clone "$wiki_url" wiki
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::Wiki is unavailable or has not been initialized; skipping optional documentation sync.'
            echo 'available=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Sync spec files to wiki
        if: steps.wiki.outputs.available == 'true'
        run: |
          # Map spec files to wiki pages
          cp main/docs/spec/README.md wiki/Home.md
          cp main/docs/spec/json-api.md wiki/JSON-API-Format.md
          cp main/docs/spec/error-codes.md wiki/Error-Codes.md
          cp main/docs/spec/pagination.md wiki/Pagination.md
          cp main/docs/spec/resource-types.md wiki/Resource-Types.md
          cp main/docs/spec/tls-certificates.md wiki/TLS-Certificates.md
          cp main/docs/spec/metering-api.md wiki/Metering-API.md
          cp main/docs/spec/authentication.md wiki/Authentication.md

          # Add sync timestamp
          echo "" >> wiki/Home.md
          echo "---" >> wiki/Home.md
          echo "_Last synced: $(date -u '+%Y-%m-%d %H:%M:%S UTC') from docs/spec/_" >> wiki/Home.md

      - name: Commit and push wiki changes
        if: steps.wiki.outputs.available == 'true'
        env:
          WIKI_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export GIT_ASKPASS="$RUNNER_TEMP/wiki-askpass" GIT_TERMINAL_PROMPT=0
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No changes to sync"
          else
            git add -A
            git commit -m "Sync from docs/spec/ ($(date -u '+%Y-%m-%d'))"
            git push
            echo "Wiki updated successfully"
          fi
