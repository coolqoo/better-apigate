# Optional CLI configuration for init/administrative commands.
# The running server reads deployment environment variables and PostgreSQL settings.
# Configure route costs, plans and providers in /admin, not in this file.
# Deployment secrets belong in the private .env generated by scripts/init-env.sh.
server:
  host: "0.0.0.0"
  port: 8080

upstream:
  url: "${APIGATE_UPSTREAM_URL}"
  timeout: 30s

database:
  driver: postgres
  dsn: "${APIGATE_DATABASE_DSN}"

logging:
  level: info
  format: json
