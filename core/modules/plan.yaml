module: plan
meta:
  description: Prepaid plan pricing in integer USD millionths. Terms retain purchased snapshots.
schema:
  name: {type: string, required: true, lookup: true}
  description: {type: string, default: ""}
  price_micros: {type: int, default: 0, constraints: [{type: min, value: 0}]}
  unit_price_micros: {type: int, default: 0, constraints: [{type: min, value: 0}]}
  included_units: {type: int, default: 0, constraints: [{type: min, value: 0}]}
  rate_limit_per_minute: {type: int, default: 600, constraints: [{type: min, value: 1}]}
  term_days: {type: int, default: 30, constraints: [{type: min, value: 30}, {type: max, value: 30}]}
  is_default: {type: bool, default: false}
  enabled: {type: bool, default: true}
channels:
  http:
    serve: {enabled: false}
